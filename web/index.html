<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#123029" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Emerald" />
  <title>Emerald</title>
  <link rel="manifest" href="web/manifest.webmanifest" crossorigin="use-credentials" />
  <link rel="apple-touch-icon" href="web/icon-192.png" />
  <link rel="icon" href="web/icon-192.png" />
  <link rel="stylesheet" href="web/style.css" />
</head>
<body>
  <main class="shell" aria-label="Emerald">
    <section class="display-panel" aria-label="Game display">
      <canvas id="screen" width="240" height="160" aria-label="Game screen"></canvas>
    </section>

    <section class="pad" aria-label="Controls">
      <div class="shoulders">
        <button data-key="l" aria-label="L">L</button>
        <button data-key="r" aria-label="R">R</button>
      </div>

      <div class="dpad" aria-label="Directional pad">
        <button data-key="up" aria-label="Up" tabindex="-1"></button>
        <button data-key="left" aria-label="Left" tabindex="-1"></button>
        <span class="dpad-center" aria-hidden="true"></span>
        <button data-key="right" aria-label="Right" tabindex="-1"></button>
        <button data-key="down" aria-label="Down" tabindex="-1"></button>
      </div>

      <div class="face" aria-label="Action buttons">
        <button data-key="b" class="btn-b">B</button>
        <button data-key="a" class="btn-a">A</button>
      </div>

      <div class="system" aria-label="Start and Select">
        <button data-key="select">SELECT</button>
        <button data-key="start">START</button>
      </div>
    </section>

    <details class="more">
      <summary><span class="menu-icon" aria-hidden="true">☰ </span>More</summary>
      <div class="status" id="cloud-status"></div>
      <div class="status" id="status">loading…</div>

      <div class="speed-control" aria-label="Speed controls">
        <div class="speed-heading">Speed <output id="speed-value">1x</output></div>
        <div class="speed-buttons">
          <button type="button" data-speed="0.5">Slower</button>
          <button type="button" data-speed="2">Faster</button>
          <button type="button" data-speed="1">Normal</button>
          <button type="button" data-speed="unlimited">Max</button>
        </div>
      </div>

      <div class="utility-controls" aria-label="Save and display controls">
        <button id="download-save" type="button">Back up save</button>
        <label class="upload-save" for="upload-save">Restore save</label>
        <button id="sound-toggle" type="button">Sound: on</button>
        <button id="fullscreen" type="button">Big Picture</button>
        <input id="upload-save" type="file" accept=".sav,.srm,application/octet-stream" />
      </div>

      <div class="layout-control" aria-label="Layout">
        <div class="speed-heading">Layout</div>
        <div class="layout-buttons">
          <button type="button" data-layout="auto">Auto</button>
          <button type="button" data-layout="pc">Screen only</button>
          <button type="button" data-layout="touch">Buttons</button>
        </div>
      </div>

      <div class="key-config" aria-label="Keyboard controls">
        <div class="speed-heading">Keyboard <button type="button" id="keys-reset" class="text-button">Reset</button></div>
        <p class="key-help" id="key-help">Click a button, then press the key you want for it. Esc opens and closes this menu.</p>
        <div class="key-grid" id="key-grid"></div>
      </div>

      <p class="keys">When you save in the game, it is kept in this browser and, on the family site, in your account too.</p>
    </details>
  </main>
  <script type="module" src="web/app.js"></script>
</body>
</html>
