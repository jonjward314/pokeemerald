# Optional: deploy with the Wrangler CLI (`npx wrangler deploy`) instead of
# uploading dist/cloudflare in the Cloudflare dashboard. See docs/WEB.md.
name = "emerald"
compatibility_date = "2026-05-29"
workers_dev = false
preview_urls = false

[build]
command = "make wrangler-site"
watch_dir = ["web", "src", "include", "data", "graphics", "sound", "tools", "Makefile"]

[assets]
directory = "./dist/cloudflare"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
